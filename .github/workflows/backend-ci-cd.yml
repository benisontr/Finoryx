name: Backend CI/CD Pipeline

on:
  push:
    branches: [main, master]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/backend/**'

jobs:
  test-and-build:
    name: Backend Test Suite & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install Dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Run Test Suites (64/64 Unit, E2E, Security & Rate Limiting Tests)
        working-directory: apps/backend
        run: npm test

      - name: Compile Production Build
        working-directory: apps/backend
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container (Verification)
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          push: false
          tags: finoryx-backend:latest

  deploy-render:
    name: Trigger Render Deployment
    needs: test-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Deploy Hook (Optional if configured)
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
